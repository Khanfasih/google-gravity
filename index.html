<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Gravity</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111111;
            font-family: arial, sans-serif;
            user-select: none;
        }
        .box {
            position: absolute;
            display: inline-block;
        }
        #logo {
            width: 272px;
            height: 92px;
            left: calc(50% - 136px);
            top: 150px;
        }
        #search-box {
            width: 450px;
            height: 40px;
            left: calc(50% - 225px);
            top: 260px;
            background: #303134;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            border: 1px solid #5f6368;
        }
    </style>
</head>
<body>

    <div id="logo" class="box">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" width="272" height="92" alt="Google">
    </div>
    
    <div id="search-box" class="box">
        google anti-gravity
    </div>

    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        window.addEventListener('load', function() {
            var Engine = Matter.Engine,
                Render = Matter.Render,
                World = Matter.World,
                Bodies = Matter.Bodies,
                Mouse = Matter.Mouse,
                MouseConstraint = Matter.MouseConstraint;

            var engine = Engine.create();
            var world = engine.world;

            // DOM elements physics bodies
            var logoEl = document.getElementById('logo');
            var searchEl = document.getElementById('search-box');

            var logoBody = Bodies.rectangle(window.innerWidth / 2, 196, 272, 92, { restitution: 0.8 });
            var searchBody = Bodies.rectangle(window.innerWidth / 2, 280, 450, 40, { restitution: 0.8 });

            // Boundaries
            var ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 25, window.innerWidth, 50, { isStatic: true });
            var leftWall = Bodies.rectangle(-25, window.innerHeight / 2, 50, window.innerHeight, { isStatic: true });
            var rightWall = Bodies.rectangle(window.innerWidth + 25, window.innerHeight / 2, 50, window.innerHeight, { isStatic: true });

            World.add(world, [logoBody, searchBody, ground, leftWall, rightWall]);

            // Mouse interactivity
            var mouse = Mouse.create(document.body);
            var mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            World.add(world, mouseConstraint);

            // Sync physics loop with DOM
            (function renderLoop() {
                Engine.update(engine, 1000 / 60);

                logoEl.style.transform = 'translate(' + (logoBody.position.x - window.innerWidth / 2) + 'px, ' + (logoBody.position.y - 196) + 'px) rotate(' + logoBody.angle + 'rad)';
                searchEl.style.transform = 'translate(' + (searchBody.position.x - window.innerWidth / 2) + 'px, ' + (searchBody.position.y - 280) + 'px) rotate(' + searchBody.angle + 'rad)';
