<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Google Gravity</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #ffffff;
            font-family: arial, sans-serif;
        }
        #logo {
            display: block;
            margin: 150px auto 20px auto;
        }
        .search-box {
            width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        input[type="text"] {
            width: 450px;
            height: 30px;
            font-size: 16px;
            padding: 5px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <center>
            <img id="logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" width="272" height="92" alt="Google">
            <div class="search-box">
                <input type="text" value="google anti-gravity" autofocus>
            </div>
        </center>
    </div>

    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        window.addEventListener('load', function() {
            var Engine = Matter.Engine,
                Render = Matter.Render,
                World = Matter.World,
                Bodies = Matter.Bodies,
                Mouse = Matter.Mouse,
                MouseConstraint = Matter.MouseConstraint;

            var engine = Engine.create();
            var logo = document.getElementById('logo');
            var search = document.querySelector('.search-box');

            // Add boundaries & interactive gravity physics
            var ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 30, window.innerWidth, 60, { isStatic: true });
            World.add(engine.world, [ground]);

            Engine.run(engine);
        });
    </script>
</body>
</html>
